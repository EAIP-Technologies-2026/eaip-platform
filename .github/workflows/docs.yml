# =============================================================================
# EAIP — Documentation & repository health checks
# -----------------------------------------------------------------------------
# Validates internal Markdown links, governance-doc presence, per-package
# READMEs, and runs the repository healthcheck script. Independent of CI.yml
# so doc-only PRs don't have to wait on the full test matrix.
# =============================================================================

name: Docs

on:
  push:
    branches: [main, "release/**"]
    paths:
      - "**/*.md"
      - "scripts/validate-docs.sh"
      - "scripts/healthcheck.sh"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main, "release/**"]
    paths:
      - "**/*.md"
      - "scripts/validate-docs.sh"
      - "scripts/healthcheck.sh"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Markdown links + governance docs
        run: bash scripts/validate-docs.sh

      - name: Repository healthcheck
        run: bash scripts/healthcheck.sh
