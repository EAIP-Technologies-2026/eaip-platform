---
name: ✨ Feature Request
description: Propose a new capability or enhancement.
title: "feat: <concise summary>"
labels: ["type/feature", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an idea! Larger proposals are often better discussed first in
        [GitHub Discussions › Ideas](https://github.com/subham1902/eaip-platform/discussions/categories/ideas).
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and discussions and this is not a duplicate.
          required: true
        - label: I have read the [Roadmap](../../ROADMAP.md) and [Architecture](../../ARCHITECTURE.md).
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What user problem does this solve? Who is the user? What is the current pain?
      placeholder: "When deploying multi-tenant runtimes, operators have no way to set per-tenant token budgets…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How might EAIP solve this? Be specific about user-facing surface (API, CLI, config).
      placeholder: |
        Introduce a `TokenBudget` resource in the Control Plane API …
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches did you consider, and why did you prefer this one?
  - type: dropdown
    id: scope
    attributes:
      label: Affected Area
      multiple: true
      options:
        - Agent Runtime
        - Control Plane
        - LLM Adapters
        - Tool Adapters
        - Memory
        - Policy / Guardrails
        - Telemetry
        - CLI
        - Documentation
        - Build / CI
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Perceived Priority
      options:
        - Nice-to-have
        - Important — would adopt sooner if available
        - Blocking — cannot adopt without it
    validations:
      required: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I am willing to contribute a PR for this (with guidance if needed).
        - label: I am willing to help test/validate this once available.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
